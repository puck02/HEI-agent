<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Face -->
  <circle cx="50" cy="55" r="32" fill="#FFF5F8" stroke="#FF6B8A" stroke-width="2"/>
  <!-- Left ear -->
  <polygon points="22,30 30,8 42,32" fill="#FFF5F8" stroke="#FF6B8A" stroke-width="2"/>
  <!-- Right ear -->
  <polygon points="58,32 70,8 78,30" fill="#FFF5F8" stroke="#FF6B8A" stroke-width="2"/>
  <!-- Bow -->
  <ellipse cx="75" cy="22" rx="10" ry="6" fill="#E4002B"/>
  <circle cx="75" cy="22" r="3" fill="#FF4D73"/>
  <ellipse cx="67" cy="18" rx="8" ry="5" fill="#E4002B"/>
  <!-- Left eye -->
  <ellipse cx="38" cy="52" rx="4" ry="5" fill="#333"/>
  <!-- Right eye -->
  <ellipse cx="62" cy="52" rx="4" ry="5" fill="#333"/>
  <!-- Nose -->
  <ellipse cx="50" cy="58" rx="3" ry="2" fill="#FFB3C6"/>
  <!-- Mouth -->
  <path d="M44,63 Q50,68 56,63" fill="none" stroke="#333" stroke-width="1.5"/>
  <!-- Left whiskers -->
  <line x1="10" y1="54" x2="34" y2="56" stroke="#ccc" stroke-width="1"/>
  <line x1="10" y1="60" x2="34" y2="60" stroke="#ccc" stroke-width="1"/>
  <line x1="10" y1="66" x2="34" y2="64" stroke="#ccc" stroke-width="1"/>
  <!-- Right whiskers -->
  <line x1="66" y1="56" x2="90" y2="54" stroke="#ccc" stroke-width="1"/>
  <line x1="66" y1="60" x2="90" y2="60" stroke="#ccc" stroke-width="1"/>
  <line x1="66" y1="64" x2="90" y2="66" stroke="#ccc" stroke-width="1"/>
</svg>
